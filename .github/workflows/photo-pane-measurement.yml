name: Pick a distance in a photo and display it in the model
on:
  push:
    branches: [validation/photo-pane-measurement]
permissions:
  actions: read
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: OpenAEC-Foundation/open-pointcloud-studio
    steps:
      - uses: actions/checkout@v4
      - name: Install the X11 display and input tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth xdotool python3-pil mesa-vulkan-drivers
      - name: Verify and extract the published and integration builds
        run: |
          mkdir release integration
          archive=open-pointcloud-studio_2026.48.0_linux-amd64.tar.gz
          gh release download v2026.48.0 -R "$REPO" -p "$archive" -p "$archive.sha256"
          sha256sum -c "$archive.sha256"
          tar -xf "$archive" --strip-components=1 -C release
          gh api "repos/$REPO/actions/artifacts/15112946904/zip" > integration.zip
          echo 'e7b6c5086bd8fa3753a7643c84e7ee222528a9ec34e0d1841e8120a359f4d384  integration.zip' | sha256sum -c -
          unzip -q integration.zip -d integration
          chmod +x integration/open-pointcloud-studio
      - name: Click the actual ribbon and the two photo points
        env:
          WGPU_BACKEND: vulkan
          LIBGL_ALWAYS_SOFTWARE: '1'
          WINIT_UNIX_BACKEND: x11
        run: |
          for build in release integration; do
            xvfb-run -a -s '-screen 0 1800x1000x24' /usr/bin/python3 native/validation/document-panes/photo-measure.py "$build/open-pointcloud-studio" "proof/$build"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photo-measure
          path: proof/
