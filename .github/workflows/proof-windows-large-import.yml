name: Windows viewport budget field
on:
  push:
    branches: [validation/windows-budget-field]
permissions: {contents: read, actions: read}
jobs:
  open:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record runner hardware and operating system
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,TotalVisibleMemorySize
          Get-CimInstance Win32_Processor | Select-Object Name,NumberOfLogicalProcessors | Format-List
          Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion | Format-List
          Get-PhysicalDisk | Select-Object MediaType, FriendlyName | Format-List
      - name: Download PR 81 Windows build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45741551469 -R OpenAEC-Foundation/open-pointcloud-studio -n open-pointcloud-studio-windows -D package
      - name: Generate and exercise the 500 million point scan
        shell: pwsh
        run: |
          python -m pip install Pillow numpy pyautogui
          python native/validation/large-import/grid.py grid.ply
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary=(Get-ChildItem -Recurse package -Filter open-pointcloud-studio.exe).FullName
          python native/validation/large-import/retry.py $binary grid.ply 500000000 --budget 50000 --timeout 300 > result.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-large-import-result
          path: |
            result.json
            proof/*.png
